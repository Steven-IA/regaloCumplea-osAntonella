<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/estilos.css">
    <title>Regalo de cumpleaños 💜</title>
</head>
<body class="main-bg">
    <h1>Para ti, la personita que amo aún demasiado, única de mi corazón</h1>

    <p>Haz click en la jacaranda ♥️</p>

    <div class="flower-container" onclick="location.href='/carta'">
        <svg class="jacaranda" viewBox="-5 -90 10 180.4">
            <defs>
                <radialGradient id="petalGradient">
                    <stop offset="0%" stop-color="#f4eaff"></stop>
                    <stop offset="100%" stop-color="#b892f0"></stop>
                </radialGradient>
            </defs>

            <g class="petals" transform-origin="center">
                <ellipse rx="12" ry="45" fill="url(#petalGradient)" transform="rotate(0) translate(0, -45)"></ellipse>
                <ellipse rx="12" ry="45" fill="url(#petalGradient)" transform="rotate(45) translate(0, -45)"></ellipse>
                <ellipse rx="12" ry="45" fill="url(#petalGradient)" transform="rotate(90) translate(0, -45)"></ellipse>
                <ellipse rx="12" ry="45" fill="url(#petalGradient)" transform="rotate(135) translate(0, -45)"></ellipse>
                <ellipse rx="12" ry="45" fill="url(#petalGradient)" transform="rotate(180) translate(0, -45)"></ellipse>
                <ellipse rx="12" ry="45" fill="url(#petalGradient)" transform="rotate(225) translate(0, -45)"></ellipse>
                <ellipse rx="12" ry="45" fill="url(#petalGradient)" transform="rotate(270) translate(0, -45)"></ellipse>
                <ellipse rx="12" ry="45" fill="url(#petalGradient)" transform="rotate(315) translate(0, -45)"></ellipse>

                <circle r="12" fill="#6d3fa6"></circle>
            </g>
        </svg>
    </div>
</body>
</html>
